name: Publish gateway image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '24.7.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Run the full CI suite before publishing.  A failing test is the last thing
  # you want baked into a published image.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log into the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Metadata: tags and labels ──────────────────────────────────────────
      #
      # Tags follow the OCI convention:
      #   • push to main         → :edge
      #   • tag v1.2.3           → :1.2.3, :1.2, :1, :latest
      #
      # The Dockerfile lives at repo root context, so the image is self-contained.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=open-rocket-chat-gateway
            org.opencontainers.image.description=Gateway that fronts Rocket.Chat servers through a stable, version-independent API
            org.opencontainers.image.vendor=t3foundry

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gateway.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # One architecture is enough for a server-side gateway.  Multi-arch
          # (`linux/amd64,linux/arm64`) would serve ARM cloud instances but
          # doubles build time; add it when the demand appears.
          platforms: linux/amd64