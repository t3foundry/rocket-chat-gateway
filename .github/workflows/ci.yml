name: CI

on:
  push:
    # `develop` is where day-to-day work lands, so it is the branch whose health
    # actually matters between releases; `main` and the branches that feed it
    # are verified again on the way in.
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Fails on high and critical advisories only. Lower severities are
      # reported for triage but should not block an unrelated bug fix.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Report all advisories
        if: always()
        run: pnpm audit || true

  e2e:
    name: End-to-end against Rocket.Chat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # A real server, not mocks: the whole value of this layer is absorbing
      # Rocket.Chat's actual behaviour, which mocks would only re-state.
      - name: Start Rocket.Chat
        run: docker compose -f docker/rocketchat.compose.yml up -d

      - name: Wait for Rocket.Chat
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/info > /dev/null; then
              echo "Rocket.Chat is up"; exit 0
            fi
            sleep 5
          done
          echo "Rocket.Chat did not become ready"; exit 1

      - run: pnpm run test:e2e

      - name: Rocket.Chat logs
        if: failure()
        run: docker compose -f docker/rocketchat.compose.yml logs --tail 200 rocketchat

  docker:
    name: Gateway image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only — publishing is a release concern, but a Dockerfile that has
      # quietly stopped building is worth catching on the pull request.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gateway.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
